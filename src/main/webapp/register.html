<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinRakshak - Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 950px;
            max-width: 95%;
            min-height: 600px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* LEFT SIDE */

        .left-section {
            width: 45%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .left-section h2 {
            font-size: 29px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .left-section p {
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.95;
        }

        .features {
            margin-top: 30px;
        }

        .features p {
            margin: 12px 0;
            font-size: 15px;
        }

        /* RIGHT SIDE */

        .right-section {
            width: 55%;
            padding: 45px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h1 {
            font-size: 31px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 17px;
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.12);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.3);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-text a {
            color: #11998e;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 750px) {

            .container {
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                padding: 40px;
            }

            .right-section {
                padding: 40px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->

        <div class="left-section">

            <div class="logo">
                FinRakshak
            </div>

            <h2>
                Start Your Financial Journey 🚀
            </h2>

            <p>
                Create your account and start managing
                your money smarter with FinRakshak.
            </p>

            <div class="features">

                <p>✓ Track your daily expenses</p>

                <p>✓ Set and manage budgets</p>

                <p>✓ Explore student rentals</p>

                <p>✓ Organize your finances</p>

            </div>

        </div>


        <!-- RIGHT SECTION -->

        <div class="right-section">

            <h1>
                Create Account ✨
            </h1>

            <p class="subtitle">
                Join FinRakshak today
            </p>


            <form action="register" method="post">

                <div class="form-row">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college name"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
