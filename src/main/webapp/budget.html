<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinRakshak - Add Budget</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {

            width: 500px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {

            color: #11998e;

            font-size: 30px;

            font-weight: bold;

            text-align: center;

            margin-bottom: 10px;
        }

        h2 {

            text-align: center;

            color: #222;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        select,
        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        select:focus,
        input:focus {

            border-color: #11998e;

            box-shadow:
                0 0 0 3px rgba(17, 153, 142, 0.12);
        }

        .btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #11998e,
                    #38ef7d
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }

        .btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(17, 153, 142, 0.3);
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #11998e;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- LOGO -->

        <div class="logo">

            FinRakshak

        </div>


        <!-- TITLE -->

        <h2>

            Set Your Budget 💰

        </h2>


        <!-- BUDGET FORM -->

        <form action="budget" method="post">


            <!-- IMPORTANT:
                 This tells BudgetServlet
                 that we want to ADD a budget.
            -->

            <input
                type="hidden"
                name="action"
                value="add"
            >


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">

                    Category

                </label>


                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">

                        Select Category

                    </option>


                    <option value="Food">

                        Food

                    </option>


                    <option value="Travel">

                        Travel

                    </option>


                    <option value="Education">

                        Education

                    </option>


                    <option value="Shopping">

                        Shopping

                    </option>


                    <option value="Entertainment">

                        Entertainment

                    </option>


                    <option value="Medical">

                        Medical

                    </option>


                    <option value="Other">

                        Other

                    </option>

                </select>

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label for="amount">

                    Budget Amount (₹)

                </label>


                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter budget amount"
                    step="0.01"
                    min="1"
                    required
                >

            </div>


            <!-- MONTH -->

            <div class="form-group">

                <label for="month">

                    Month

                </label>


                <select
                    id="month"
                    name="month"
                    required
                >

                    <option value="">

                        Select Month

                    </option>


                    <option value="January">
                        January
                    </option>

                    <option value="February">
                        February
                    </option>

                    <option value="March">
                        March
                    </option>

                    <option value="April">
                        April
                    </option>

                    <option value="May">
                        May
                    </option>

                    <option value="June">
                        June
                    </option>

                    <option value="July">
                        July
                    </option>

                    <option value="August">
                        August
                    </option>

                    <option value="September">
                        September
                    </option>

                    <option value="October">
                        October
                    </option>

                    <option value="November">
                        November
                    </option>

                    <option value="December">
                        December
                    </option>

                </select>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn"
            >

                Add Budget

            </button>


        </form>


        <!-- BACK TO DASHBOARD -->

        <a
            href="dashboard.jsp"
            class="back"
        >

            ← Back to Dashboard

        </a>


    </div>


</body>

</html>
